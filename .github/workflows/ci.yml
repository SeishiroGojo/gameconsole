name: GameConsole CI

# Pipeline: probar cada componente, probar el sistema integrado con Docker Compose
# (consola + Prolog + GameStats), publicar las imágenes en GHCR y (opcional) desplegar.
# Documentación: docs/instalacion-y-deployment.md

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-prolog:
    name: Probar la IA en Prolog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      - name: Pruebas unitarias (plunit)
        working-directory: prolog
        run: swipl -g run_tests -t halt test_ai.pl

  test-console:
    name: Probar la consola (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: console/requirements-dev.txt
      - name: Instalar dependencias
        working-directory: console
        run: pip install -r requirements-dev.txt
      - name: Pruebas (juegos, envío de eventos, API)
        working-directory: console
        run: python -m pytest -q
      - name: Revisar la sintaxis del JavaScript de la interfaz
        run: node --check console/app/static/app.js

  e2e:
    name: Integración (Docker Compose + prueba de humo)
    runs-on: ubuntu-latest
    needs: [test-prolog, test-console]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clonar GameStats junto a este repositorio (el compose lo construye desde ../gamestats)
        run: git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY_OWNER}/gamestats.git" ../gamestats
      - name: Construir y levantar todo con Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Estado de los contenedores
        run: docker compose ps
      - name: Prueba de humo de punta a punta
        run: python3 scripts/smoketest.py http://localhost:8000
      - name: Logs de los servicios (solo si falló)
        if: failure()
        run: docker compose logs --no-color
      - name: Limpiar
        if: always()
        run: docker compose down -v

  publish:
    name: Publicar imagen ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: console
            context: console
            image: gameconsole-console
          - name: prolog
            context: prolog
            image: gameconsole-prolog
    steps:
      - uses: actions/checkout@v4
      - name: Dueño de las imágenes en minúsculas (GHCR lo exige)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Resumen
        env:
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Imagen publicada: $IMAGE"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Despliegue por SSH (opcional)
    runs-on: ubuntu-latest
    needs: publish
    # Desactivado por defecto: requiere la variable DEPLOY_ENABLED=true y los
    # secretos DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY y DEPLOY_PATH.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Copiar el compose y actualizar los contenedores
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          SSH="ssh -i $HOME/.ssh/id_deploy $DEPLOY_USER@$DEPLOY_HOST"
          $SSH "mkdir -p '$DEPLOY_PATH'"
          scp -i "$HOME/.ssh/id_deploy" docker-compose.deploy.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.deploy.yml"
          $SSH "cd '$DEPLOY_PATH' && (grep -q '^GHCR_OWNER=' .env 2>/dev/null || echo 'GHCR_OWNER=$OWNER_LC' >> .env) && docker compose -f docker-compose.deploy.yml pull && docker compose -f docker-compose.deploy.yml up -d"
      - name: Esperar a que la consola responda
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_deploy" "$DEPLOY_USER@$DEPLOY_HOST" \
            'for i in $(seq 1 30); do (curl -fsS http://localhost:8000/health || wget -qO- http://localhost:8000/health) && exit 0; sleep 2; done; exit 1'
